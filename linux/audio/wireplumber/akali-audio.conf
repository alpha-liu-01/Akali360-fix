monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.platform-avs_da7219.*"
      }
      {
        node.name = "~alsa_input.platform-avs_da7219.*"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 2000
        priority.session = 2000
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.platform-avs_max98357a.*"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 1500
        priority.session = 1500
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.platform-avs_hdaudio.*"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 100
        priority.session = 100
      }
    }
  }
]
